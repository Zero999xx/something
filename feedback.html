<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🎮 GameHub</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="about.html">About</a>
            <a href="feedback.html" class="active">Feedback</a>
        </nav>
    </header>

    <section class="page-title">
        <h1>Feedback</h1>
        <p>We would love to hear from you!</p>
    </section>

    <section class="feedback-section">

        <!-- FIX 1: Added id="feedbackForm" right here -->
        <form class="feedback-form" id="feedbackForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="game">Favorite Game</label>
            <select id="game">
                <option value="">Select a game</option>
                <option>Battle Arena</option>
                <option>Mystic Land</option>
                <option>Pixel Quest</option>
                <option>Racing X</option>
            </select>

            <label>How would you rate GameHub?</label>
            <div class="rating">
                <label>
                    <input type="radio" name="rating" value="1"> ⭐
                </label>
                <label>
                    <input type="radio" name="rating" value="2"> ⭐⭐
                </label>
                <label>
                    <input type="radio" name="rating" value="3"> ⭐⭐⭐
                </label>
                <label>
                    <input type="radio" name="rating" value="4"> ⭐⭐⭐⭐
                </label>
                <label>
                    <input type="radio" name="rating" value="5"> ⭐⭐⭐⭐⭐
                </label>
            </div>

            <label for="message">Your Feedback</label>
            <textarea id="message"
                      rows="6"
                      placeholder="Write your feedback here..."
                      required></textarea>

            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>

        </form>

    </section>

    <footer>
        <p>© 2026 GameHub. All Rights Reserved.</p>
    </footer>

    <!-- FIX 2: Script placed right before closing </body> tag -->
    <script>
    const form = document.getElementById("feedbackForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const data = new URLSearchParams();
        data.append("name", document.getElementById("name").value);
        data.append("email", document.getElementById("email").value);
        data.append("game", document.getElementById("game").value);
        data.append("rating", document.querySelector('input[name="rating"]:checked')?.value || "");
        data.append("message", document.getElementById("message").value);

        fetch("https://script.google.com/macros/s/AKfycbxkawYf6dBbhX24h-b3TZga3RzpF_71fM0m25oVPGaCJC7Sx4WPmjH8eNdt-y5NABWNfA/exec", {
            method: "POST",
            mode: "no-cors",
            body: data
        })
        .then(() => {
            alert("Feedback submitted successfully!");
            form.reset();
        })
        .catch(error => {
            console.error(error);
            alert("Something went wrong!");
        });
    });
    </script>

</body>
</html>
